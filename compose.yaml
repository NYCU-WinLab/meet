name: ${COMPOSE_PROJECT_NAME:-meet}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meet
      POSTGRES_USER: meet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meet", "-d", "meet"]
      interval: 5s
      retries: 20

  # One-shot: applies drizzle/*.sql, then web starts.
  migrate:
    image: ghcr.io/nycu-winlab/meet:${MEET_VERSION:-main}
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgres://meet:${POSTGRES_PASSWORD}@postgres:5432/meet
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/nycu-winlab/meet:${MEET_VERSION:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://meet:${POSTGRES_PASSWORD}@postgres:5432/meet
    ports:
      - ${MEET_BIND:-127.0.0.1}:${MEET_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/.well-known/oauth-protected-resource').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      retries: 10

  # Running summary: joins every room as a hidden participant, sends each
  # microphone to the lab's transcribe service in short chunks and has a small
  # model keep one summary (questions, improvements, decisions) that the
  # meeting page shows. Same LiveKit env as web, plus TRANSCRIBE_TOKEN and
  # ANTHROPIC_API_KEY.
  summary:
    image: ghcr.io/nycu-winlab/meet-summary:${MEET_VERSION:-main}
    restart: unless-stopped
    env_file: .env

volumes:
  postgres:
