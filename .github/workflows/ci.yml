name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run tokens:check
      - run: bun run actions:check
      - run: bun run build
      - run: cd summary && bun install --frozen-lockfile && bun run typecheck

  # Builds the images once, runs deploy/smoke.sh against them and pushes
  # them as candidate-<tree>. promote makes them tree-<tree> once every job
  # passed, and release ships only tree- images.
  image:
    uses: zyx1121/.github/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '[{"name": "ghcr.io/nycu-winlab/meet"}, {"name": "ghcr.io/nycu-winlab/meet-summary", "context": "summary"}]'
      smoke: bash deploy/smoke.sh

  promote:
    needs: [check, image]
    uses: zyx1121/.github/.github/workflows/promote.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '["ghcr.io/nycu-winlab/meet", "ghcr.io/nycu-winlab/meet-summary"]'
